name: Devcontainer Parity Verification

on:
  push:
    paths:
      - '.devcontainer/**'
      - 'deps.edn'
      - 'package.json'
      - 'package-lock.json'
    branches: [master]
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'deps.edn'
      - 'package.json'
      - 'package-lock.json'
    branches: [master]
  schedule:
    # Weekly parity run on Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer-parity:
    name: devcontainer-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build devcontainer image with Buildx layer caching
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: bwr-devcontainer:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit test suite inside devcontainer
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace --user 0:0 \
            bwr-devcontainer:local clojure -M:test

      - name: Run Playwright E2E suite inside devcontainer
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace --user 0:0 \
            -e BWR_ENV=test -e BWR_RATE_LIMIT_MAX=10000 \
            bwr-devcontainer:local bash -c "npm ci --ignore-scripts && npx playwright install chromium && npx playwright test"
