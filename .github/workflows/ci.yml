name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard against BWR_ENV leakage in non-E2E job
        run: bash ci/guard-bwr-env.sh

      - name: Run shellcheck over CI shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck ci/*.sh

  compile:
    name: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard against BWR_ENV leakage in non-E2E job
        run: bash ci/guard-bwr-env.sh


      - name: Set up Temurin JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20'

      - name: Cache Maven and Clojure classpath
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install Clojure CLI (pinned to 1.12.0.1488)
        run: bash ci/install-clojure.sh

      - name: Execute Compile Gate (strict reflection filtering under bwr/)
        run: bash ci/compile-gate.sh

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard against BWR_ENV leakage in non-E2E job
        run: bash ci/guard-bwr-env.sh

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20'

      - name: Cache Maven and Clojure classpath
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Install Clojure CLI (pinned to 1.12.0.1488)
        run: bash ci/install-clojure.sh

      - name: Run unit and generative tests
        run: clojure -M:test

      - name: Run RocksDB persistence smoke test
        run: bash ci/rocksdb-smoke.sh

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20'

      - name: Set up Node.js (pinned to 22.14.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'

      - name: Cache Maven and Clojure classpath
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Clojure CLI (pinned to 1.12.0.1488)
        run: bash ci/install-clojure.sh

      - name: Install npm dependencies (ignore-scripts)
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium explicitly
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E test suite
        run: npx playwright test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard against BWR_ENV leakage in non-E2E job
        run: bash ci/guard-bwr-env.sh

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20'

      - name: Set up Node.js (pinned to 22.14.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'

      - name: Cache Maven and Clojure classpath
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Clojure CLI (pinned to 1.12.0.1488)
        run: bash ci/install-clojure.sh

      - name: Verify scanner canary (proves CVE scanner fails on vulnerabilities)
        run: bash ci/test-canary.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify CVE gate decision logic (offline fixture-based test suite)
        run: bash ci/test-filter.sh

      - name: Run CVE Dependency Gate (npm audit + clj-watson)
        run: bash ci/cve-gate.sh github-advisory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint, compile, unit, e2e, deps-audit]
    if: always()
    steps:
      - name: Verify aggregate status across all gates
        run: |
          echo "Verifying individual gate results:"
          echo " - lint:       ${{ needs.lint.result }}"
          echo " - compile:    ${{ needs.compile.result }}"
          echo " - unit:       ${{ needs.unit.result }}"
          echo " - e2e:        ${{ needs.e2e.result }}"
          echo " - deps-audit: ${{ needs.deps-audit.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.compile.result }}" != "success" ] || \
             [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ] || \
             [ "${{ needs.deps-audit.result }}" != "success" ]; then
            echo "ERROR: One or more required CI gate jobs failed." >&2
            exit 1
          fi

          echo "All CI gates PASSED successfully. Status: green."
